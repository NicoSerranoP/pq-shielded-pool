[package]
name = "pq_cairo_shielded_pool"
version = "0.1.0"
edition = "2024_07"

[lib]
sierra = true
casm = false

[[target.executable]]
name = "pq_cairo_shielded_pool_deposit"
function = "pq_cairo_shielded_pool::deposit_main"

[[target.executable]]
name = "pq_cairo_shielded_pool_transfer"
function = "pq_cairo_shielded_pool::transfer_main"

[[target.executable]]
name = "pq_cairo_shielded_pool_withdraw"
function = "pq_cairo_shielded_pool::withdraw_main"

[cairo]
enable-gas = false

[dependencies]
cairo_execute = ">=2.18.0"

[dev-dependencies]
cairo_test = "2.18.0"
