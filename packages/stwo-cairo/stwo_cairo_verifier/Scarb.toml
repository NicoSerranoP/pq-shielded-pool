    "crates/atlantic_stwo_deserialize_pcs_queried",
    "crates/atlantic_stwo_deserialize_pcs_fri",
    "crates/atlantic_stwo_output",
    "crates/atlantic_stwo_output_raw",
    "crates/atlantic_stwo_program_hash_blake",
    "crates/atlantic_stwo_program_hash_words_blake",
    "crates/atlantic_stwo_blake_smoke",
    "crates/atlantic_stwo_blake_finalize64_smoke",
    "crates/atlantic_stwo_blake_hash16_smoke",
    "crates/atlantic_stwo_blake_span_inline_smoke",
    "crates/atlantic_stwo_blake_hash17_smoke",
    "crates/atlantic_stwo_program_encode_blake",
    "crates/atlantic_stwo_claim",
    "crates/atlantic_stwo_claim_basics",
    "crates/atlantic_stwo_claim_builtins",
    "crates/atlantic_stwo_claim_program",
    "crates/atlantic_stwo_program_first",
    "crates/atlantic_stwo_program_multi",
    "crates/atlantic_stwo_claim_registers",
