    "crates/atlantic_stwo_channel_config",
    "crates/atlantic_stwo_channel_salt",
    "crates/atlantic_stwo_channel_pack",
    "crates/atlantic_stwo_channel_manual_hash",
    "crates/atlantic_stwo_pcs_mix",
    "crates/atlantic_stwo_commitment_unpack",
    "crates/atlantic_stwo_preprocessed_commit",
    "crates/atlantic_stwo_claim_mix",
    "crates/atlantic_stwo_pow",
    "crates/atlantic_stwo_lookup",
    "crates/atlantic_stwo_air",
    "crates/atlantic_stwo_verify",
    "crates/circuit_air",
    "crates/constraint_framework",
    "crates/verifier_core",
    "crates/verifier_utils",
]

[workspace.tool.cairo-lint]
collapsible_if_else = false
double_parens = false
ifs_same_cond = false
manual_assert = false

[cairo]
enable-gas = false
allow-warnings = false

# The profile that should be used when compiling the verifier for proving.
# This profile enables unsafe-panic to reduce the code size.
[profile.proving.cairo]
enable-gas = false
unsafe-panic = true
allow-warnings = false
